<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notcoin Fullscreen Ad Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            height: 100vh; overflow: hidden;
        }

        .header {
            text-align: center;
            margin-top: 25px;
        }
        .balance-title {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-container {
            font-size: 52px;
            font-weight: 900;
            color: #facc15;
            text-shadow: 0 0 30px rgba(250, 204, 21, 0.5);
            margin-top: 5px;
        }

        .clicker-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
        }

        .tap-button {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, #fde047 0%, #ca8a04 100%);
            border: 8px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 60px rgba(250, 204, 21, 0.4), inset 0 0 30px rgba(255, 255, 255, 0.5);
            transition: transform 0.08s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            outline: none;
        }
        .tap-button:active {
            transform: scale(0.92);
        }
        .coin-inner-icon {
            font-size: 90px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        .floating-number {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: #facc15;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.3); }
        }

        .footer-section {
            width: 100%;
            padding: 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            color: #94a3b8;
            padding: 0 5px;
        }
        .energy-bar-bg {
            width: 100%;
            height: 10px;
            background: #1e293b;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #facc15);
            border-radius: 5px;
            transition: width 0.2s ease;
        }

        .ad-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-title">Your Balance</div>
        <div class="score-container" id="score">0</div>
    </div>

    <div class="clicker-container" id="clickerArea">
        <button class="tap-button" id="tapBtn">
            <span class="coin-inner-icon">🪙</span>
        </button>
    </div>

    <div class="footer-section">
        <div class="energy-info">
            <span>⚡ Energy</span>
            <span><span id="energy">1000</span> / <span id="maxEnergy">1000</span></span>
        </div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyBar"></div>
        </div>

        <button class="ad-button" id="showFullscreenAdBtn">Show Fullscreen Ad 📺</button>
    </div>

    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = parseInt(localStorage.getItem('not_score')) || 0;
        let maxEnergy = 1000;
        let energy = parseInt(localStorage.getItem('not_energy')) || 1000;
        let tapPower = 1;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const maxEnergyEl = document.getElementById('maxEnergy');
        const energyBar = document.getElementById('energyBar');
        const showFullscreenAdBtn = document.getElementById('showFullscreenAdBtn');
        const clickerArea = document.getElementById('clickerArea');
        const tapBtn = document.getElementById('tapBtn');

        scoreEl.textContent = score;
        energyEl.textContent = energy;
        maxEnergyEl.textContent = maxEnergy;
        updateEnergyBar();

        function updateEnergyBar() {
            const percent = (energy / maxEnergy) * 100;
            energyBar.style.width = percent + '%';
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                energyEl.textContent = energy;
                updateEnergyBar();
                localStorage.setItem('not_energy', energy);
            }
        }, 1000);

        tapBtn.addEventListener('click', (e) => {
            if (energy >= tapPower) {
                score += tapPower;
                energy -= tapPower;

                scoreEl.textContent = score;
                energyEl.textContent = energy;
                updateEnergyBar();

                localStorage.setItem('not_score', score);
                localStorage.setItem('not_energy', energy);

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }

                const rect = tapBtn.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const floatNum = document.createElement('div');
                floatNum.className = 'floating-number';
                floatNum.textContent = `+${tapPower}`;
                floatNum.style.left = `${x}px`;
                floatNum.style.top = `${y}px`;
                clickerArea.appendChild(floatNum);

                setTimeout(() => {
                    floatNum.remove();
                }, 800);
            }
        });

        // Adsgram Fullscreen Integration
        let adController = null;
        function initAds() {
            if (window.Adsgram) {
                try {
                    adController = window.Adsgram.init({ blockId: "int-44837", debug: true });
                } catch (e) {
                    console.log("Adsgram init error:", e);
                }
            }
        }
        setTimeout(initAds, 500);

        // Толық экранды жарнаманы шығару батырмасы
        showFullscreenAdBtn.addEventListener('click', async () => {
            if (!adController) {
                initAds();
                if (!adController) {
                    alert("Ads loading... Please wait a second.");
                    return;
                }
            }
            try {
                // Бұл функция жарнаманы толық экранда көрсетеді
                await adController.show();
                console.log("Fullscreen ad watched successfully");
            } catch (err) {
                console.log("Ad closed or error", err);
            }
        });
    </script>
</body>
</html>
