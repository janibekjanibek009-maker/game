<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Clicker</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .score {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffd700;
        }
        .coin {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #ffe066 0%, #f59f00 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .coin:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>Coin Clicker</h1>
    <div class="score" id="score">0</div>
    <div class="coin" id="coin">🪙</div>

    <script>
        // Telegram WebApp бастау
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Ойын логикасы
        let count = 0;
        const scoreEl = document.getElementById('score');
        const coinEl = document.getElementById('coin');

        coinEl.addEventListener('click', () => {
            count++;
            scoreEl.innerText = count;
        });

        // Adsgram инициализациясы (Сіздің UnitID: int-44684)
        const AdController = window.Adsgram.init({ blockId: "int-44684" });

        function showAdsgramAd() {
            AdController.show().then((result) => {
                console.log("Жарнама сәтті көрсетілді:", result);
            }).catch((error) => {
                console.error("Жарнама қатесі:", error);
            });
        }

        // Жарнаманы бірінші рет 5 секундтан кейін көрсету
        setTimeout(() => {
            showAdsgramAd();
        }, 5000);

        // Кейін әр 5 секунд (5000 мс) сайын қайталап шығару
        setInterval(() => {
            showAdsgramAd();
        }, 5000);
    </script>
</body>
</html>
