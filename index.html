<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монета Кликері</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #2b2b3d;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .score-board {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .click-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd700, #ffaa00);
            border: 4px solid #fff;
            font-size: 60px;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s;
            box-shadow: 0 8px 15px rgba(255, 215, 0, 0.4);
        }

        .click-btn:active {
            transform: scale(0.92);
        }

        .shop {
            margin-top: 30px;
            text-align: left;
        }

        .shop-item {
            background: #3b3b52;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .shop-btn:disabled {
            background: #777;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Монета Кликері</h1>
        <div class="score-board">💰 <span id="score">0</span></div>

        <button class="click-btn" onclick="clickCoin()">🪙</button>

        <div class="shop">
            <h3>Дүкен (Жақсартулар)</h3>
            
            <div class="shop-item">
                <div>
                    <div><strong>Күшті клик (+1)</strong></div>
                    <small>Бағасы: <span id="click-cost">10</span> монета</small>
                </div>
                <button class="shop-btn" id="btn-click" onclick="buyClickUpgrade()">Сатып алу</button>
            </div>

            <div class="shop-item">
                <div>
                    <div><strong>Автокликер (+1/сек)</strong></div>
                    <small>Бағасы: <span id="auto-cost">50</span> монета</small>
                </div>
                <button class="shop-btn" id="btn-auto" onclick="buyAutoClicker()">Сатып алу</button>
            </div>
        </div>
    </div>

    <script>
        let score = 0;
        let clickPower = 1;
        let autoClickers = 0;

        let clickUpgradeCost = 10;
        let autoUpgradeCost = 50;

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('click-cost').innerText = clickUpgradeCost;
            document.getElementById('auto-cost').innerText = autoUpgradeCost;

            document.getElementById('btn-click').disabled = score < clickUpgradeCost;
            document.getElementById('btn-auto').disabled = score < autoUpgradeCost;
        }

        function clickCoin() {
            score += clickPower;
            updateUI();
        }

        function buyClickUpgrade() {
            if (score >= clickUpgradeCost) {
                score -= clickUpgradeCost;
                clickPower += 1;
                clickUpgradeCost = Math.floor(clickUpgradeCost * 1.5);
                updateUI();
            }
        }

        function buyAutoClicker() {
            if (score >= autoUpgradeCost) {
                score -= autoUpgradeCost;
                autoClickers += 1;
                autoUpgradeCost = Math.floor(autoUpgradeCost * 1.8);
                updateUI();
            }
        }

        setInterval(() => {
            if (autoClickers > 0) {
                score += autoClickers;
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>

</body>
</html>
