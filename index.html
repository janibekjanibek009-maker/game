<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notcoin Clicker Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 15px 10px;
            box-sizing: border-box;
            user-select: none;
            overflow: hidden;
        }
        .header { text-align: center; }
        .balance {
            font-size: 2.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff;
        }
        .clicker-area {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .coin {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #27272a 0%, #09090b 100%);
            border: 4px solid #3f3f46;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5.5rem;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.15);
            cursor: pointer;
            transition: transform 0.05s ease;
        }
        .coin:active { transform: scale(0.92); }
        .floating-num {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            color: #00ffcc;
            animation: floatUp 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }
        .energy-container { width: 100%; max-width: 320px; margin-bottom: 10px; }
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #a1a1aa;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background: #18181b;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #27272a;
        }
        .energy-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #00bfff);
            width: 100%;
            transition: width 0.2s;
        }
        .menu-panel {
            width: 100%;
            max-width: 350px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: #18181b;
            padding: 8px;
            border-radius: 14px;
            border: 1px solid #27272a;
        }
        .menu-btn {
            background: #27272a;
            border: none;
            color: #fff;
            padding: 8px 4px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .menu-btn:active { background: #3f3f46; }
        
        /* Модальды терезелер (Дүкен мен Дос шақыру) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #18181b;
            padding: 20px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            border: 1px solid #3f3f46;
            text-align: center;
        }
        .modal-content h3 { margin-top: 0; color: #00ffcc; }
        .shop-item {
            background: #27272a;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .buy-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .close-btn {
            background: #3f3f46;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance"><span id="score">0</span> 🪙</div>
    </div>

    <div class="clicker-area" id="clickArea">
        <div class="coin" id="coin">💎</div>
    </div>

    <div class="energy-container">
        <div class="energy-info">
            <span>⚡ Энергия</span>
            <span><span id="energy">1000</span> / 1000</span>
        </div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill" id="energyFill"></div>
        </div>
    </div>

    <div class="menu-panel">
        <button class="menu-btn" onclick="activateBoost()">🚀 <span>Буст 10x</span></button>
        <button class="menu-btn" onclick="openShop()">🛒 <span>Дүкен</span></button>
        <button class="menu-btn" onclick="showRewardedAd()">🎬 <span>Жарнама</span></button>
        <button class="menu-btn" onclick="openInviteModal()">👥 <span>Дос</span></button>
    </div>

    <!-- ДҮКЕН МОДАЛЬДЫ ТЕРЕЗЕСІ (Ақшаға/Stars монета сатып алу) -->
    <div class="modal" id="shopModal">
        <div class="modal-content">
            <h3>🛒 Монета дүкені</h3>
            <div class="shop-item">
                <span>+10,000 Монета</span>
                <button class="buy-btn" onclick="buyCoins(10000, 1)">1 ⭐</button>
            </div>
            <div class="shop-item">
                <span>+50,000 Монета</span>
                <button class="buy-btn" onclick="buyCoins(50000, 4)">4 ⭐</button>
            </div>
            <div class="shop-item">
                <span>+150,000 Монета</span>
                <button class="buy-btn" onclick="buyCoins(150000, 10)">10 ⭐</button>
            </div>
            <button class="close-btn" onclick="closeModal('shopModal')">Жабу</button>
        </div>
    </div>

    <!-- ДОС ШАҚЫРУ МОДАЛЬДЫ ТЕРЕЗЕСІ -->
    <div class="modal" id="inviteModal">
        <div class="modal-content">
            <h3>👥 Дос шақыру</h3>
            <p style="font-size: 0.85rem; color: #a1a1aa;">Досыңыз сіздің сілтемеңізбен кірген кезде ғана автоматты түрде +1000 монета беріледі!</p>
            <button class="buy-btn" style="width:100%; padding: 10px;" onclick="shareInviteLink()">Сілтемені жіберу</button>
            <button class="close-btn" onclick="closeModal('inviteModal')">Жабу</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        let count = parseInt(localStorage.getItem('notcoin_count')) || 0;
        let energy = parseInt(localStorage.getItem('notcoin_energy')) || 1000;
        const maxEnergy = 1000;
        let multiplier = 1;

        const scoreEl = document.getElementById('score');
        const coinEl = document.getElementById('coin');
        const energyEl = document.getElementById('energy');
        const energyFill = document.getElementById('energyFill');
        const clickArea = document.getElementById('clickArea');

        scoreEl.innerText = count;
        updateEnergyUI();

        // --- РЕФЕРАЛДЫ ТЕКСЕРУ (Ботқа басқа біреу арқылы кіргенін анықтау) ---
        window.addEventListener('load', () => {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
                const refId = tg.initDataUnsafe.start_param;
                const rewardedKey = `ref_reward_${refId}`;
                // Егер бұл рефера үшін әлі сыйлық алмаған болса
                if (!localStorage.getItem(rewardedKey)) {
                    count += 1000;
                    scoreEl.innerText = count;
                    localStorage.setItem('notcoin_count', count);
                    localStorage.setItem(rewardedKey, 'true');
                    alert("🎉 Дос шақыру сілтемесі арқылы кіргеніңіз үшін +1000 монета берілді!");
                }
            }
        });

        // Басқан кезде монета жинау
        coinEl.addEventListener('click', (e) => {
            if (energy <= 0) {
                alert("Энергия таусылды!");
                return;
            }

            energy -= 1;
            count += multiplier;
            
            scoreEl.innerText = count;
            updateEnergyUI();

            localStorage.setItem('notcoin_count', count);
            localStorage.setItem('notcoin_energy', energy);

            // Клик эффектісі
            const rect = coinEl.getBoundingClientRect();
            const x = e.clientX - rect.left - 20;
            const y = e.clientY - rect.top - 20;
            
            const floatText = document.createElement('div');
            floatText.className = 'floating-num';
            floatText.innerText = '+' + multiplier;
            floatText.style.left = x + 'px';
            floatText.style.top = y + 'px';
            clickArea.appendChild(floatText);

            setTimeout(() => floatText.remove(), 600);
        });

        // Энергияның қайта толуы
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                updateEnergyUI();
                localStorage.setItem('notcoin_energy', energy);
            }
        }, 1000);

        function updateEnergyUI() {
            energyEl.innerText = energy;
            energyFill.style.width = (energy / maxEnergy) * 100 + '%';
        }

        // 10x Буст (30 секунд)
        function activateBoost() {
            if (multiplier > 1) {
                alert("Буст әлі де жұмыс істеп тұр!");
                return;
            }
            multiplier = 10;
            alert("🚀 10x Буст қосылды!");
            setTimeout(() => {
                multiplier = 1;
                alert("Буст уақыты аяқталды.");
            }, 30000);
        }

        // --- ЖАРНАМА (Тек толық көріп бітіргенде монета береді) ---
        function showRewardedAd() {
            if (window.Adsgram) {
                const AdController = window.Adsgram.init({ blockId: "int-44684" });
                AdController.show().then((result) => {
                    // Жарнама сәтті аяқталды
                    count += 300;
                    scoreEl.innerText = count;
                    localStorage.setItem('notcoin_count', count);
                    alert("🎬 Жарнаманы сәтті көрдіңіз: +300 монета қосылды!");
                }).catch((err) => {
                    console.log("Жарнама қатесі немесе жабылды:", err);
                    alert("Жарнама толық көрілмеді немесе қате орын алды.");
                });
            } else {
                alert("Жарнама жүйесі жүктелмеді.");
            }
        }

        // ӘР 40 СЕКУНД САЙЫН АВТОМАТТЫ ШЫҚҚАН ЖАРНАМА
        setInterval(() => {
            if (window.Adsgram) {
                const AdController = window.Adsgram.init({ blockId: "int-44684" });
                AdController.show().then(() => {
                    count += 100; // Авто жарнама үшін аздырақ бонус
                    scoreEl.innerText = count;
                    localStorage.setItem('notcoin_count', count);
                }).catch(err => console.log(err));
            }
        }, 40000);

        // --- МОДАЛЬДЫ ТЕРЕЗЕЛЕРДІ БАСҚАРУ ---
        function openShop() { document.getElementById('shopModal').style.display = 'flex'; }
        function openInviteModal() { document.getElementById('inviteModal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById('id', id).style.display = 'none'; } // түзетілген төмендегідей:
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

        // Дұрыс рефералдық сілтеме жасау (Дос шақыру)
        function shareInviteLink() {
            const botUsername = "Tapping_1bot"; // Өз ботыңыздың username-ін жазыңыз
            const userId = tg?.initDataUnsafe?.user?.id || "my_id";
            const inviteLink = `https://t.me/share/url?url=https://t.me/${botUsername}?start=${userId}&text=Ойынға кіріп, бірге монета жинайық!`;
            
            if (tg) {
                tg.openTelegramLink(inviteLink);
            } else {
                window.open(inviteLink, '_blank');
            }
        }

        // Ақшаға/Stars монета сатып алу (Дүкен)
        function buyCoins(amount, starsPrice) {
            if (confirm(`${starsPrice} ⭐ жұмсап ${amount} монета сатып алғыңыз келе ме?`)) {
                // Telegram Stars төлем логикасы немесе симуляциясы
                count += amount;
                scoreEl.innerText = count;
                localStorage.setItem('notcoin_count', count);
                alert(`Сәтті сатып алынды! +${amount} монета қосылды.`);
                closeModal('shopModal');
            }
        }
    </script>
</body>
</html>
