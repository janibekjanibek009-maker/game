<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Clicker Ultimate</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            user-select: none;
            box-sizing: border-box;
            transition: background 0.5s;
        }
        h1 { margin: 5px 0; font-size: 1.8rem; }
        .score {
            font-size: 2.5rem;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            margin-bottom: 5px;
        }
        .multiplier-badge {
            font-size: 1rem;
            color: #ff4500;
            font-weight: bold;
            height: 20px;
        }
        .coin-container {
            position: relative;
            margin: 15px 0;
        }
        .coin {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #ffe066 0%, #f59f00 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: transform 0.05s, background 0.3s;
        }
        .coin:active { transform: scale(0.92); }
        
        .panel {
            width: 100%;
            max-width: 350px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 10px;
            backdrop-filter: blur(5px);
        }
        .panel-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; color: #aaa; text-align: center; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn {
            background: #2c2c2e;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }
        .btn:active { opacity: 0.8; }
        .btn-accent { border-color: #ffd700; color: #ffd700; }
        .btn-boost { border-color: #ff4500; color: #ff4500; }
        .btn-ad { border-color: #30d158; color: #30d158; }
        
        .skins-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .skin-item {
            min-width: 60px;
            height: 60px;
            background: #2c2c2e;
            border: 2px solid transparent;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
        }
        .skin-item.active { border-color: #ffd700; background: #3a3a3c; }
        .skin-item.locked { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Coin Clicker</h1>
    <div class="score" id="score">0</div>
    <div class="multiplier-badge" id="boostStatus"></div>

    <div class="coin-container">
        <div class="coin" id="coin">🪙</div>
    </div>

    <!-- КҮШЕЙТКІШТЕР -->
    <div class="panel">
        <div class="panel-title">⚡ БУСТТАР ЖӘНЕ БОНУС</div>
        <div class="btn-grid">
            <button class="btn btn-boost" id="boostX10Btn">🚀 10X Буст (30сек)<br><small>Тегін (Кулдаун: 2мин)</small></button>
            <button class="btn btn-accent" id="inviteBtn">👥 Досыңды шақыр<br><small>+1000 монета ал</small></button>
            <button class="btn btn-ad" id="dailyBtn">📅 Күнделікті Бонус</button>
            <button class="btn btn-ad" onclick="showAd(true)">🎬 Жарнама (+200)</button>
        </div>
    </div>

    <!-- СКИНДЕР ЖӘНЕ ФОНДАР -->
    <div class="panel">
        <div class="panel-title">🎨 СКИНДЕР (5-күн Скин береді)</div>
        <div class="skins-list" id="skinsList">
            <div class="skin-item active" onclick="selectSkin('🪙', '#1c1c1e')">🪙</div>
            <div class="skin-item locked" id="skinDiamond" onclick="selectSkin('💎', 'linear-gradient(to bottom, #000428, #004e92)')">💎</div>
            <div class="skin-item locked" id="skinCrown" onclick="selectSkin('👑', 'linear-gradient(to bottom, #11998e, #38ef7d)')">👑</div>
            <div class="skin-item locked" id="skinFire" onclick="selectSkin('🔥', 'linear-gradient(to bottom, #ff416c, #ff4b2b)')">🔥</div>
        </div>
    </div>

    <script>
        // Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // Деректер
        let count = parseInt(localStorage.getItem('count')) || 0;
        let activeMultiplier = 1;
        let isBoostActive = false;
        let lastBoostTime = parseInt(localStorage.getItem('lastBoostTime')) || 0;
        
        // Күнделікті сыйақылар
        const dailyRewards = [10, 50, 100, 200, "SKIN", 500, 1000];
        let loginStreak = parseInt(localStorage.getItem('loginStreak')) || 0;
        let lastLoginDate = localStorage.getItem('lastLoginDate') || "";

        const scoreEl = document.getElementById('score');
        const coinEl = document.getElementById('coin');
        const boostStatusEl = document.getElementById('boostStatus');
        const boostX10Btn = document.getElementById('boostX10Btn');

        scoreEl.innerText = count;

        // Монета басу
        coinEl.addEventListener('click', () => {
            let added = 1 * activeMultiplier;
            count += added;
            scoreEl.innerText = count;
            localStorage.setItem('count', count);
        });

        // 10X БУСТ (30 секунд)
        boostX10Btn.addEventListener('click', () => {
            const now = Date.now();
            if (now - lastBoostTime < 120000) {
                const waitSec = Math.ceil((120000 - (now - lastBoostTime)) / 1000);
                alert(`Бустты қайта қолдану үшін ${waitSec} секунд күтіңіз!`);
                return;
            }

            isBoostActive = true;
            activeMultiplier = 10;
            lastBoostTime = now;
            localStorage.setItem('lastBoostTime', lastBoostTime);

            let timeLeft = 30;
            boostStatusEl.innerText = `🔥 10X БУСТ АКТИВТІ: ${timeLeft}с`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    boostStatusEl.innerText = `🔥 10X БУСТ АКТИВТІ: ${timeLeft}с`;
                } else {
                    clearInterval(timer);
                    activeMultiplier = 1;
                    isBoostActive = false;
                    boostStatusEl.innerText = "";
                    alert("10X Буст уақыты аяқталды!");
                }
            }, 1000);
        });

        // РЕФЕРАЛ / ДОСЫҢДЫ ШАҚЫРУ
        document.getElementById('inviteBtn').addEventListener('click', () => {
            const botUsername = "Tapping_1bot"; // Сіздің бот
            const userId = tg?.initDataUnsafe?.user?.id || "user";
            const inviteLink = `https://t.me/share/url?url=https://t.me/${botUsername}?start=${userId}&text=Ойынға кір де, 1000 монета ал!`;
            
            if (tg) { tg.openTelegramLink(inviteLink); }
            
            // Бонус беру
            count += 1000;
            scoreEl.innerText = count;
            localStorage.setItem('count', count);
            alert("Дос шақырғаныңыз үшін +1000 монета қосылды!");
        });

        // КҮНДЕЛІКТІ СЫЙАҚЫ
        document.getElementById('dailyBtn').addEventListener('click', checkDailyReward);

        function checkDailyReward() {
            const today = new Date().toDateString();
            if (lastLoginDate === today) {
                alert("Бүгінгі сыйақыны алып қойдыңыз! Ертең қайта кіріңіз.");
                return;
            }

            const yesterday = new Date(Date.now() - 86400000).toDateString();
            if (lastLoginDate === yesterday) {
                loginStreak = (loginStreak + 1) % 7;
            } else {
                loginStreak = 0; // Күн өткізіп алса, қайта басынан бастайды
            }

            lastLoginDate = today;
            localStorage.setItem('loginStreak', loginStreak);
            localStorage.setItem('lastLoginDate', lastLoginDate);

            const reward = dailyRewards[loginStreak];
            if (reward === "SKIN") {
                unlockSkin('skinFire');
                alert("🎉 5-КҮН БОНУСЫ: Жаңа От 👑 Скині ашылды!");
            } else {
                count += reward;
                scoreEl.innerText = count;
                localStorage.setItem('count', count);
                alert(`🎉 ${loginStreak + 1}-күн бонусы: +${reward} монета алдыңыз!`);
            }
        }

        // СКИНДЕР ЖӘНЕ ФОН
        function selectSkin(emoji, bgStyle) {
            coinEl.innerText = emoji;
            document.body.style.background = bgStyle;
        }

        function unlockSkin(skinId) {
            const skinEl = document.getElementById(skinId);
            if(skinEl) skinEl.classList.remove('locked');
        }

        // ADSGRAM ЖАРНАМАСЫ (Әр 40 секунд сайын)
        function showAd(isManual = false) {
            if (window.Adsgram) {
                const AdController = window.Adsgram.init({ blockId: "int-44684" });
                AdController.show().then(() => {
                    if (isManual) {
                        count += 200;
                        scoreEl.innerText = count;
                        localStorage.setItem('count', count);
                    }
                }).catch(err => console.log("Ad error:", err));
            }
        }

        setInterval(() => {
            showAd(false);
        }, 40000); // 40000 мс = 40 секунд
    </script>
</body>
</html>
